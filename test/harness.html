<!DOCTYPE html><html><head><meta charset="utf-8"><title>PuttLab harness</title></head>
<body>
<script type="module">
import { demuxMp4 } from '../src/mp4.js';
import { decodeAll, analyseTiming, webCodecsSupported } from '../src/decoder.js';
import { computeHomography, invert3, applyH, foldFaceAngle, unwrapAngles, bearingDeg, solveLinear } from '../src/geom.js';
import { createTracker } from '../src/track.js';
import { analyseStroke, findImpact, faceAngleAt, pathAngleAt, TAKEAWAY_FRACTION } from '../src/analyse.js';
import { rgb2hsv, sampleHue, components } from '../src/detect.js';

/* Run the whole pipeline on a fixture and hand back both the analysis and
   the raw per-frame observations, so tests can dig in when something fails. */
async function runFixture(url, truth, overrides = {}) {
  const buf = await (await fetch(url)).arrayBuffer();
  const info = demuxMp4(buf);
  const timing = analyseTiming(info, overrides.captureFps || null);

  const H = computeHomography(
    truth.quad.map(([x, y]) => ({ x, y })),
    [{ x: 0, y: 0 }, { x: truth.matW, y: 0 }, { x: truth.matW, y: truth.matL }, { x: 0, y: truth.matL }]
  );

  const tracker = createTracker({
    H, quad: truth.quad.map(([x, y]) => ({ x, y })),
    matW: truth.matW, srcWidth: info.width, srcHeight: info.height,
    opt: { ...(overrides.opt || {}), marker: { hue: truth.markerHue, ...(overrides.opt?.marker || {}) } }
  });

  const cvs = new OffscreenCanvas(tracker.detW, tracker.detH);
  const ctx = cvs.getContext('2d', { willReadFrequently: true });
  const frames = [];
  const t0 = performance.now();

  await decodeAll(buf, {
    timeScale: timing.timeScale,
    onFrame: (frame, t) => {
      ctx.drawImage(frame, 0, 0, tracker.detW, tracker.detH);
      const img = ctx.getImageData(0, 0, tracker.detW, tracker.detH);
      frames.push(tracker.process(img.data, t));
    }
  });

  const elapsedMs = performance.now() - t0;
  const result = analyseStroke(frames, { markerless: !!overrides.opt?.markerless });
  return {
    info: { codec: info.config.codec, w: info.width, h: info.height,
            samples: info.samples.length, nominalFps: info.nominalFps, hasBFrames: info.hasBFrames },
    timing, result, elapsedMs,
    frameCount: frames.length,
    faceFound: frames.filter(f => f.face).length,
    ballFound: frames.filter(f => f.ball).length
  };
}

window.PL = { runFixture, demuxMp4, decodeAll, analyseTiming, webCodecsSupported,
              computeHomography, invert3, applyH, createTracker, analyseStroke,
              findImpact, faceAngleAt, pathAngleAt, rgb2hsv, sampleHue, components,
              foldFaceAngle, unwrapAngles, bearingDeg, solveLinear, TAKEAWAY_FRACTION };
window.PL_READY = true;
</script>
</body></html>
